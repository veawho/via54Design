<div class="flow-steps">
  <div class="flow-step-card">
    <span class="step-badge">1</span>
    <h3>直接提交到 Forge</h3>
    <div style="margin-bottom:8px" hx-get="/api/htmx/forge-status" hx-trigger="load, every 10s" hx-target="#fStatus"></div>
    <div id="fStatus"></div>
    <form hx-post="/api/htmx/regen" hx-target="#fOutput" hx-indicator="#fSpin">
      <textarea name="prompt" rows="4" placeholder="输入提示词..." style="margin-bottom:6px"></textarea>
      <textarea name="negative" rows="2" placeholder="负面提示词（可选）" style="margin-bottom:6px;font-size:11px"></textarea>
      <select name="workflow" style="margin-bottom:6px">
        <option value="sdxl_txt2img">SDXL 文生图</option>
        <option value="flux_dev_txt2img">Flux Dev 文生图</option>
        <option value="sdxl_img2img">SDXL 图生图</option>
        <option value="animatediff_txt2vid">AnimateDiff 文生视频</option>
      </select>
      <div style="display:flex;gap:6px">
        <button type="submit" class="btn-primary">提交生成</button>
        <span id="fSpin" class="htmx-indicator" style="font-size:12px;color:var(--text-dim)">提交中...</span>
      </div>
    </form>
    <div id="fOutput" style="margin-top:8px"></div>
  </div>
</div>
