<div class="flow-steps">
  <!-- Card 1: Doc to PPT -->
  <div class="flow-step-card">
    <span class="step-badge">1</span>
    <h3 data-i18n-key="doc-to-ppt">上传文档 → PPT 框架</h3>
    <form hx-post="/api/htmx/story2ppt" hx-target="#s2pOutput" hx-indicator="#s2pSpin" hx-encoding="multipart/form-data" style="margin-top:12px">
      <label for="s2pFile" class="upload-mini btn-edit-icon" style="border:1px dashed var(--border);border-radius:var(--radius-sm);padding:24px;text-align:center;margin-bottom:12px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <span style="font-weight:600;font-size:12px;color:var(--text-primary)" data-i18n-key="click-upload-doc">点击选择本地文档 (.docx, .txt, .pdf)</span>
      </label>
      <input type="file" id="s2pFile" name="file" accept=".docx,.pptx,.txt,.md" style="display:none"
             hx-post="/api/htmx/upload" hx-target="#s2pUploadResult" hx-encoding="multipart/form-data"
             onchange="document.getElementById('s2pFileName').textContent = this.files[0] ? this.files[0].name : '';">
      <div id="s2pFileName" style="font-size:11px;color:var(--accent3);margin-bottom:8px;text-align:center;font-weight:600"></div>
      <div id="s2pUploadResult"></div>
      
      <input type="text" name="seed" placeholder="补充背景/受众描述（可选）" style="width:100%;background:var(--bg-inset);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);padding:8px 12px;font-size:12.5px;margin-bottom:12px">
      
      <div style="display:flex;gap:6px">
        <button type="submit" class="btn-primary">📊 生成 PPT 框架</button>
        <span id="s2pSpin" class="htmx-indicator" style="font-size:12px;color:var(--text-dim)" data-i18n-key="analyzing">分析中...</span>
      </div>
    </form>
    <div id="s2pOutput" style="margin-top:8px"></div>
  </div>

  <!-- Card 2: Narrative Seed to Deck -->
  <div class="flow-step-card">
    <span class="step-badge">2</span>
    <h3>故事种子 → 叙事框架</h3>
    <form hx-post="/api/htmx/narrate" hx-target="#s2pNarrateOut" hx-indicator="#s2pNarrSpin" style="margin-top:12px">
      <textarea name="seed" rows="3" placeholder="例如: 智能驾驶汽车的下一代感知系统演进..." style="width:100%;background:var(--bg-inset);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);padding:10px;font-size:12.5px;margin-bottom:10px"></textarea>
      
      <select name="model" class="custom-select" style="margin-bottom:10px;width:100%">
        <option value="three-act">三幕剧 — 产品发布三段论</option>
        <option value="heros-journey">英雄之旅 — 品牌创立故事</option>
        <option value="cognitive-arc">认知弧 — 专业科普与研究教程</option>
        <option value="problem-solution">问题解决 — 商业销售与路演</option>
      </select>
      
      <div style="display:flex;gap:6px">
        <button type="submit" class="btn-primary">⚡ 生成叙事框架</button>
        <span id="s2pNarrSpin" class="htmx-indicator" style="font-size:12px;color:var(--text-dim)" data-i18n-key="thinking">生成中...</span>
      </div>
    </form>
    <div id="s2pNarrateOut" style="margin-top:8px"></div>
  </div>
</div>
