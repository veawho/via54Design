<div class="flow-steps">
  <div class="flow-step-card">
    <span class="step-badge">1</span>
    <h3>📝 生成提示词</h3>
    <form hx-post="/api/htmx/prompt" hx-target="#pOutput" hx-indicator="#pSpin">
      <textarea name="scene" rows="3" placeholder="描述场景..." style="margin-bottom:6px"></textarea>
      <select name="platform" style="margin-bottom:6px">
        <option value="midjourney">Midjourney</option>
        <option value="flux">Flux</option>
        <option value="dalle3">DALL-E 3</option>
        <option value="sd3">SD3</option>
        <option value="stable_diffusion">Stable Diffusion</option>
        <option value="kling">Kling</option>
        <option value="pika">Pika</option>
        <option value="gemini">Gemini</option>
      </select>
      <div style="display:flex;gap:6px">
        <button type="submit" class="btn-primary">✨ 生成提示词</button>
        <span id="pSpin" class="htmx-indicator" style="font-size:12px;color:var(--text-dim)">⏳ 生成中...</span>
      </div>
    </form>
    <div id="pOutput" style="margin-top:8px"></div>
  </div>

  <div class="flow-step-card">
    <span class="step-badge">2</span>
    <h3>🖼️ 图片上传（可选）</h3>
    <form hx-post="/api/htmx/upload" hx-target="#pUploadResult" hx-encoding="multipart/form-data" hx-trigger="change">
      <label for="pFile" class="upload-mini" style="border:1px dashed var(--border);border-radius:var(--radius-sm);padding:12px;text-align:center;cursor:pointer">
        📎 点击上传参考图
      </label>
      <input type="file" id="pFile" name="image" accept="image/*" style="display:none"
             hx-post="/api/htmx/upload" hx-target="#pUploadResult" hx-encoding="multipart/form-data">
    </form>
    <div id="pUploadResult"></div>
  </div>

  <div class="flow-step-card">
    <span class="step-badge">3</span>
    <h3>⚡ 提交 Forge</h3>
    <div style="margin-bottom:8px" hx-get="/api/htmx/forge-status" hx-trigger="load, every 15s" hx-target="#pForgeStatus"></div>
    <div id="pForgeStatus"></div>
    <form hx-post="/api/htmx/regen" hx-target="#pForgeOut" hx-indicator="#pForgeSpin">
      <textarea name="prompt" rows="3" placeholder="从上方输出区复制提示词到这里，或直接输入..." style="margin-bottom:6px;font-size:11px"></textarea>
      <input type="hidden" name="workflow" value="sdxl_txt2img">
      <div style="display:flex;gap:6px">
        <button type="submit" class="btn-primary">⚡ 提交生成</button>
        <span id="pForgeSpin" class="htmx-indicator" style="font-size:12px;color:var(--text-dim)">⏳ 提交中...</span>
      </div>
    </form>
    <div id="pForgeOut" style="margin-top:8px"></div>
  </div>
</div>
