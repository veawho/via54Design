<div class="flow-steps">
  <!-- Active Template card -->
  <form hx-post="/api/htmx/generate" hx-target="#dOutput" hx-indicator="#dSpin">
    <div class="template-card">
      <div class="template-card-header" data-i18n-key="active-template">Active Template</div>
      <div class="template-card-title">
        <select name="layout" class="custom-select" style="font-size:18px;font-weight:700;background:transparent;border:none;padding:0;text-align:left;min-width:200px;color:var(--text-primary)">
          <option value="">加载中...</option>
        </select>
      </div>
      
      <div class="form-row">
        <span class="form-label" data-i18n-key="responsive-design">Responsive Design</span>
        <div class="control-right">
          <span style="font-size:11px;color:var(--accent)" data-i18n-key="active">Active</span>
          <label class="switch">
            <input type="checkbox" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
      
      <div class="form-row">
        <span class="form-label" data-i18n-key="layout-mode">Layout Mode</span>
        <div class="control-right">
          <select name="mode" class="custom-select">
            <option value="presentation" data-i18n-key="presentation-16-9">16:9 Presentation</option>
            <option value="" data-i18n-key="web-responsive">Web Responsive</option>
          </select>
        </div>
      </div>
    </div>
    
    <!-- Lovart Style Tabs -->
    <div class="lovart-tabs">
      <span class="lovart-tab" onclick="switchDesignTab('details')" id="tab-btn-details" data-i18n-key="tab-details">Details</span>
      <span class="lovart-tab active" onclick="switchDesignTab('styles')" id="tab-btn-styles" data-i18n-key="tab-styles">Styles</span>
      <span class="lovart-tab" onclick="switchDesignTab('content')" id="tab-btn-content" data-i18n-key="tab-content">Content</span>
      <span class="lovart-tab" onclick="switchDesignTab('settings')" id="tab-btn-settings" data-i18n-key="tab-settings">Settings</span>
    </div>
    
    <!-- Tab pane sections -->
    <div class="template-card" style="margin-bottom: 16px">
      <!-- Section 1: Details -->
      <div id="section-details" class="design-section" style="display:none">
        <div class="form-row">
          <span class="form-label" data-i18n-key="title-input">Design Title</span>
          <div class="control-right">
            <input type="text" name="title" value="Aurum Homes" placeholder="Title" style="width:160px;background:var(--bg-inset);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);padding:4px 8px;font-size:12px">
          </div>
        </div>
        <div class="form-row">
          <span class="form-label">作者 (Author)</span>
          <div class="control-right">
            <input type="text" value="via54Design" readonly style="width:160px;background:var(--bg-inset);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-dim);padding:4px 8px;font-size:12px">
          </div>
        </div>
      </div>

      <!-- Section 2: Styles (Active by default) -->
      <div id="section-styles" class="design-section">
        <div class="form-row">
          <span class="form-label" data-i18n-key="base-color">Theme Palette</span>
          <div class="control-right">
            <select name="color" class="custom-select">
              <option value="">加载中...</option>
            </select>
          </div>
        </div>
        
        <div class="form-row">
          <span class="form-label" data-i18n-key="font-family">Font Family</span>
          <div class="control-right">
            <select name="font" class="custom-select">
              <option value="">加载中...</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Section 3: Content -->
      <div id="section-content" class="design-section" style="display:none">
        <div class="form-row" style="flex-direction:column;align-items:stretch;gap:6px">
          <span class="form-label" style="margin-bottom:4px">设计内容 (Narrative Content)</span>
          <textarea rows="3" placeholder="输入您的网页描述，例如: 曜金极简豪宅设计画册页面..." style="width:100%;background:var(--bg-inset);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);padding:8px;font-size:12px"></textarea>
        </div>
      </div>

      <!-- Section 4: Settings -->
      <div id="section-settings" class="design-section" style="display:none">
        <div class="form-row">
          <span class="form-label">调试模式 (Debug Mode)</span>
          <div class="control-right">
            <label class="switch">
              <input type="checkbox">
              <span class="slider"></span>
            </label>
          </div>
        </div>
        <div class="form-row">
          <span class="form-label">代码混淆 (Minify HTML)</span>
          <div class="control-right">
            <label class="switch">
              <input type="checkbox" checked>
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>

      <div style="margin-top:20px">
        <button type="submit" class="btn-outline-gold" data-i18n-key="save-changes">Save Changes</button>
      </div>
    </div>
  </form>
  
  <div style="display:flex;justify-content:center;margin-bottom:12px">
    <span id="dSpin" class="htmx-indicator" style="font-size:12px;color:var(--accent)">⏳ <span data-i18n-key="compiling">Compiling design pipeline...</span></span>
  </div>
  
  <div id="dOutput"></div>

  </div>


<script>
function switchDesignTab(tabName) {
  // Toggle active class on buttons
  document.querySelectorAll('.lovart-tab').forEach(t => t.classList.remove('active'));
  const activeTab = document.getElementById('tab-btn-' + tabName);
  if (activeTab) activeTab.classList.add('active');

  // Hide all sections
  document.querySelectorAll('.design-section').forEach(s => s.style.display = 'none');
  
  // Show target section
  const targetSection = document.getElementById('section-' + tabName);
  if (targetSection) targetSection.style.display = 'block';
}

(function() {
  const lang = localStorage.getItem('via54_lang') || 'zh';

  function getPresetName(entry) {
    if (!entry) return '';
    const nameVal = entry.Name || entry.name;
    const idVal = entry.ID || entry.id;
    if (!nameVal) return idVal;
    if (typeof nameVal === 'string') return nameVal;
    if (typeof nameVal === 'object') {
      return nameVal[lang] || nameVal['zh'] || nameVal['en'] || idVal;
    }
    return idVal;
  }

  // Load and populate presets
  fetch('/api/presets')
    .then(r => r.json())
    .then(data => {
      const layoutSelect = document.querySelector('select[name="layout"]');
      const colorSelect = document.querySelector('select[name="color"]');
      const fontSelect = document.querySelector('select[name="font"]');

      if (data.layouts && layoutSelect) {
        layoutSelect.innerHTML = '';
        data.layouts.forEach(l => {
          const opt = new Option(getPresetName(l), l.ID || l.id);
          layoutSelect.add(opt);
        });
        if (data.active && data.active.layout) {
          layoutSelect.value = data.active.layout;
        }
      }
      if (data.color_schemes && colorSelect) {
        colorSelect.innerHTML = '';
        data.color_schemes.forEach(c => {
          const opt = new Option(getPresetName(c), c.ID || c.id);
          colorSelect.add(opt);
        });
        if (data.active && data.active.color) {
          colorSelect.value = data.active.color;
        }
      }
      if (data.typography && fontSelect) {
        fontSelect.innerHTML = '';
        data.typography.forEach(f => {
          const opt = new Option(getPresetName(f), f.ID || f.id);
          fontSelect.add(opt);
        });
        if (data.active && data.active.font) {
          fontSelect.value = data.active.font;
        }
        
        // After presets are loaded, fetch local system fonts
        fetchLocalFonts(fontSelect, data.active ? data.active.font : null);
      }

      // Restore active layout mode
      const modeSelect = document.querySelector('select[name="mode"]');
      if (modeSelect && data.active && data.active.mode !== undefined) {
        modeSelect.value = data.active.mode;
      }
    })
    .catch(err => console.error("加载系统预置失败:", err));

  function fetchLocalFonts(select, activeFont) {
    fetch('/api/local-fonts')
      .then(r => r.json())
      .then(fonts => {
        if (select && fonts && fonts.length > 0) {
          const group = document.createElement('optgroup');
          group.label = "本地系统字体";
          fonts.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f;
            opt.textContent = f;
            group.appendChild(opt);
          });
          select.appendChild(group);
          
          if (activeFont && fonts.includes(activeFont)) {
            select.value = activeFont;
          }
        }
      })
      .catch(err => console.error("读取系统字体失败:", err));
  }
})();
</script>
