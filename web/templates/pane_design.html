<div class="flow-steps">
  <!-- Active Template card -->
  <form hx-post="/api/htmx/generate" hx-target="#dOutput" hx-indicator="#dSpin">
    <div class="template-card">
      <div class="template-card-header" data-i18n-key="active-template">Active Template</div>
      <div class="template-card-title">
        <select name="layout" class="custom-select" style="font-size:18px;font-weight:700;background:transparent;border:none;padding:0;text-align:left;min-width:200px;color:var(--text-primary)">
          <option value="hero-split-16-9">Aurum Minimalist</option>
          <option value="bento-grid-2x2">Bento Grid 2x2</option>
          <option value="gallery-waterfall">Gallery Waterfall</option>
        </select>
      </div>
      
      <div class="form-row">
        <span class="form-label" data-i18n-key="responsive-design">Responsive Design</span>
        <div class="control-right">
          <span style="font-size:11px;color:var(--accent)" data-i18n-key="active">Active</span>
          <label class="switch">
            <input type="checkbox" checked disabled>
            <span class="slider"></span>
          </label>
        </div>
      </div>
      
      <div class="form-row">
        <span class="form-label" data-i18n-key="layout-mode">Layout Mode</span>
        <div class="control-right">
          <select name="mode" class="custom-select">
            <option value="presentation" data-i18n-key="presentation-16-9">16:9 Presentation</option>
            <option value="" data-i18n-key="web-responsive">Web Responsive</option>
          </select>
        </div>
      </div>
    </div>
    
    <!-- Lovart Style Tabs -->
    <div class="lovart-tabs">
      <span class="lovart-tab" data-i18n-key="tab-details">Details</span>
      <span class="lovart-tab active" data-i18n-key="tab-styles">Styles</span>
      <span class="lovart-tab" data-i18n-key="tab-content">Content</span>
      <span class="lovart-tab" data-i18n-key="tab-settings">Settings</span>
    </div>
    
    <!-- Style settings -->
    <div class="template-card" style="margin-bottom: 16px">
      <div class="form-row">
        <span class="form-label" data-i18n-key="title-input">Design Title</span>
        <div class="control-right">
          <input type="text" name="title" value="Aurum Homes" placeholder="Title" style="width:160px;background:var(--bg-inset);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);padding:4px 8px;font-size:12px">
        </div>
      </div>
      
      <div class="form-row">
        <span class="form-label" data-i18n-key="base-color">Theme Palette</span>
        <div class="control-right">
          <select name="color" class="custom-select">
            <option value="rinpa-gold">Obsidian Gold</option>
            <option value="dark-terminal-blue">Terminal Blue</option>
            <option value="ink-wash">Ink Wash</option>
            <option value="cinematic-neon">Cyber Neon</option>
          </select>
        </div>
      </div>
      
      <div class="form-row">
        <span class="form-label" data-i18n-key="font-family">Font Family</span>
        <div class="control-right">
          <select name="font" class="custom-select">
            <option value="display-sans-bold">Outfit (Sans)</option>
            <option value="cormorant-elegant">Cormorant (Serif)</option>
            <option value="mono-terminal">JetBrains Mono</option>
          </select>
        </div>
      </div>
      
      <div style="margin-top:20px">
        <button type="submit" class="btn-outline-gold" data-i18n-key="save-changes">Save Changes</button>
      </div>
    </div>
  </form>
  
  <div style="display:flex;justify-content:center;margin-bottom:12px">
    <span id="dSpin" class="htmx-indicator" style="font-size:12px;color:var(--accent)">⏳ <span data-i18n-key="compiling">Compiling design pipeline...</span></span>
  </div>
  
  <div id="dOutput"></div>

  <!-- Document converter panel -->
  <div class="template-card">
    <div class="template-card-header" data-i18n-key="doc-to-ppt">Document Converter</div>
    <div class="template-card-title btn-edit-icon" style="font-size:15px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      <span data-i18n-key="story2ppt-outline">Doc to PPT Scaffold</span>
    </div>
    
    <form hx-post="/api/htmx/story2ppt" hx-target="#dDocOutput" hx-indicator="#dDocSpin" hx-encoding="multipart/form-data" style="margin-top:12px">
      <label for="dDocFile" class="upload-mini btn-edit-icon" style="border:1px dashed var(--border);border-radius:var(--radius-sm);padding:16px;text-align:center;margin-bottom:12px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
        <span data-i18n-key="click-upload-doc">Click to Upload Document</span>
      </label>
      <input type="file" id="dDocFile" name="file" accept=".docx,.pptx,.txt,.md,.pdf" style="display:none"
             hx-post="/api/htmx/upload" hx-target="#dDocUploadResult" hx-encoding="multipart/form-data">
      <div id="dDocUploadResult"></div>
      
      <input type="text" name="seed" placeholder="Story Seed (Optional)" style="width:100%;background:var(--bg-inset);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);padding:8px 12px;font-size:12px;margin-bottom:12px" data-i18n-key="story-seed-ph">
      
      <button type="submit" class="btn-outline-gold btn-edit-icon" style="border-color:var(--text-secondary);color:var(--text-primary);display:flex;justify-content:center;align-items:center;gap:6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        <span data-i18n-key="generate-scaffold">Generate Outline</span>
      </button>
    </form>
    
    <div style="display:flex;justify-content:center;margin-top:10px">
      <span id="dDocSpin" class="htmx-indicator" style="font-size:12px;color:var(--accent)">⏳ <span data-i18n-key="analyzing">Analyzing document semantics...</span></span>
    </div>
    <div id="dDocOutput" style="margin-top:8px"></div>
  </div>
</div>


<script>
(function() {
  fetch('/api/local-fonts')
    .then(r => r.json())
    .then(fonts => {
      const select = document.querySelector('select[name="font"]');
      if (select && fonts && fonts.length > 0) {
        // Clear any previous optgroup
        const existing = select.querySelector('optgroup[label="本地系统字体"]');
        if (existing) existing.remove();
        
        const group = document.createElement('optgroup');
        group.label = "本地系统字体";
        fonts.forEach(f => {
          const opt = document.createElement('option');
          opt.value = f;
          opt.textContent = f;
          group.appendChild(opt);
        });
        select.appendChild(group);
      }
    })
    .catch(err => console.error("读取系统字体失败:", err));
})();
</script>
