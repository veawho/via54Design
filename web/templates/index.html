<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>via54Design — 极客结构化设计与叙事引擎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
/* ── Design System Base (黑金风格 Black & Gold) ── */
:root {
  --bg: #050508;
  --bg-elevated: rgba(15, 15, 20, 0.75);
  --bg-card: rgba(22, 22, 28, 0.55);
  --bg-inset: rgba(8, 8, 12, 0.85);
  --border: rgba(197, 160, 89, 0.15);
  --border-glow: rgba(212, 175, 55, 0.35);
  --text-primary: #f5f4f0;
  --text-secondary: #d2d0c8;
  --text-dim: #929088;
  --accent: #d4af37; /* Luxury Gold */
  --accent-hover: #e5c158;
  --accent-subtle: rgba(212, 175, 55, 0.12);
  --accent-glow: rgba(212, 175, 55, 0.3);
  --accent2: #ff5e7e;
  --accent3: #39e5a4;
  --accent4: #ff9f43;
  --radius: 12px;
  --radius-sm: 8px;
  --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Microsoft YaHei', 'Meiryo', 'Noto Sans SC', 'Noto Sans CJK JP', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --space-1: 6px;
  --space-2: 12px;
  --space-3: 20px;
  --space-4: 32px;
  --space-5: 48px;
  --space-6: 72px;
}

@media(prefers-reduced-motion: no-preference) {
  .intent-btn, .status-chip, .btn-primary, .flow-step-card, input, select, textarea, .lang-btn {
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
}
@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* Scrollbar & Selection */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 99px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--border-glow);
}
::selection {
  background: var(--accent-subtle);
  color: var(--text-primary);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text-primary);
  line-height: 1.6;
  height: 100vh;
  display: flex;
  flex-direction: row; /* Sidebar is left, main content is right */
  position: relative;
  overflow: hidden;
  transition: background 0.3s, color 0.3s;
}

/* Light Mode Overrides */
body.light-mode {
  --bg: #f5f5f7;
  --bg-elevated: #e5e5ea;
  --bg-card: #ffffff;
  --bg-inset: #eaeaea;
  --text-primary: #111112;
  --text-secondary: #444448;
  --text-dim: #636366;
  --border: rgba(197, 160, 89, 0.35);
  --border-glow: rgba(212, 175, 55, 0.65);
  --accent-subtle: rgba(212, 175, 55, 0.1);
  --accent-glow: rgba(212, 175, 55, 0.4);
}
body.light-mode .sidebar {
  background: #eaeaea;
}
body.light-mode .top-bar {
  background: #eaeaea;
}
body.light-mode .right-pane {
  background: #f5f5f7;
}
body.light-mode .iframe-container {
  background: #e5e5ea;
}
body.light-mode .device-btn {
  background: #eaeaea;
  color: #1c1c1e;
}
body.light-mode .device-btn.active {
  background: var(--accent-subtle);
  color: var(--accent);
}

/* Background Ambient Gold Glows */
body::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100vw;
  height: 600px;
  background: radial-gradient(circle at top, rgba(212, 175, 55, 0.09) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* Sidebar Navigation */
.sidebar {
  width: 220px;
  background: #08080a;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  height: 100vh;
  padding: 24px 16px;
  position: relative;
  z-index: 10;
  transition: background 0.3s;
}
.sidebar-brand {
  margin-bottom: 40px;
  text-align: center;
}
.brand-num {
  font-size: 44px;
  font-weight: 700;
  line-height: 1;
  color: var(--accent);
  letter-spacing: -1px;
}
.brand-text {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 4px;
  color: var(--text-secondary);
  margin-top: 4px;
  text-indent: 4px;
}
.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 600;
  border: 1px solid transparent;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.nav-item:hover {
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.02);
}
.nav-item.active {
  background: var(--accent-subtle);
  color: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
}
.nav-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  color: inherit;
  width: 18px;
  height: 18px;
}
.nav-icon svg {
  width: 100%;
  height: 100%;
}
.btn-edit-icon {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* Theme toggle btn */
.mode-toggle-container {
  margin-top: auto;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.mode-toggle-btn {
  width: 100%;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.2s;
}
.mode-toggle-btn:hover {
  border-color: var(--border-glow);
  color: var(--text-primary);
}

/* Main Content Workspace */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  height: 100vh;
}

/* Top Bar */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  height: 64px;
  flex-shrink: 0;
  z-index: 2;
  transition: background 0.3s;
}
.top-logo {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--text-primary);
}
.top-logo em {
  font-style: normal;
  color: var(--accent);
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 16px;
}

/* Lang Switcher group */
.lang-switcher {
  display: flex;
  gap: 4px;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid var(--border);
  padding: 4px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
.lang-btn {
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 16px;
  cursor: pointer;
  transition: all 0.2s;
}
.lang-btn:hover {
  color: var(--text-primary);
}
.lang-btn.active {
  background: linear-gradient(135deg, var(--accent-hover), var(--accent));
  color: #000;
  box-shadow: 0 2px 10px rgba(212, 175, 55, 0.4);
}

/* Hero Section */
.hero-section {
  text-align: center;
  padding: var(--space-5) var(--space-3) var(--space-3);
  position: relative;
  z-index: 1;
}
.hero-role {
  font-size: clamp(28px, 5vw, 44px);
  font-weight: 700;
  letter-spacing: -1px;
  margin-bottom: var(--space-1);
}
.hero-role em {
  font-style: normal;
  background: linear-gradient(135deg, #fff2cc, var(--accent), #bfa15f);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 40px rgba(212, 175, 55, 0.15);
}
.hero-tagline {
  font-size: clamp(14px, 2vw, 17px);
  color: var(--text-secondary);
  max-width: 600px;
  margin: 0 auto;
  font-weight: 300;
}

/* Status Bar */
.principles-bar {
  background: var(--bg-elevated);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: var(--space-2) var(--space-3);
  z-index: 2;
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
}
.status-grid {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  justify-content: center;
}
.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  background: rgba(255, 255, 255, 0.01);
  border: 1px solid var(--border);
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.03);
}
.status-chip .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dot.ok {
  background: var(--accent3);
  box-shadow: 0 0 10px var(--accent3);
  animation: pulse-green 2s infinite;
}
.dot.warn {
  background: var(--accent4);
  box-shadow: 0 0 10px var(--accent4);
}
.dot.off {
  background: var(--accent2);
  box-shadow: 0 0 10px var(--accent2);
}
.status-chip .label {
  color: var(--text-secondary);
  font-weight: 400;
}
.status-chip .val {
  color: var(--text-primary);
  font-weight: 600;
}

/* Intent Bar */
.intent-bar {
  display: flex;
  gap: 12px;
  padding: 20px;
  background: var(--bg-elevated);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  flex-shrink: 0;
  z-index: 2;
  justify-content: center;
}
.intent-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 14px 24px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-card);
  cursor: pointer;
  min-width: 110px;
  flex-shrink: 0;
  text-decoration: none;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
.intent-btn:hover {
  border-color: var(--border-glow);
  background: rgba(255, 255, 255, 0.03);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(212, 175, 55, 0.12);
}
.intent-btn.active, .intent-btn:focus {
  border-color: var(--accent);
  background: var(--accent-subtle);
  box-shadow: 0 0 20px rgba(212, 175, 55, 0.15), inset 0 1px 1px rgba(255,255,255,0.05);
  transform: none;
}
.intent-btn .intent-icon {
  font-size: 24px;
  filter: drop-shadow(0 0 8px rgba(212,175,55,0.2));
}
.intent-btn .intent-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: 0.5px;
}

/* Split Pane Workspace */
.app-container {
  display: flex;
  flex: 1;
  overflow: hidden;
  height: calc(100vh - 64px); /* 100vh minus top-bar height */
}
.left-pane {
  width: 40%;
  min-width: 380px;
  overflow-y: auto;
  border-right: 1px solid var(--border);
  padding: 24px;
  background: rgba(10, 10, 15, 0.4);
}
.right-pane {
  width: 60%;
  display: flex;
  flex-direction: column;
  background: #020203;
  position: relative;
  transition: background 0.3s;
}

/* Template Card & Forms corresponding to Lovart UI mockup */
.template-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 24px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  transition: border-color 0.25s, box-shadow 0.25s;
}
.template-card:hover {
  border-color: var(--border-glow);
  box-shadow: 0 12px 40px rgba(212, 175, 55, 0.1);
}
.template-card-header {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-dim);
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.template-card-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 16px;
}
.form-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.03);
}
.form-row:last-child {
  border-bottom: none;
}
.form-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
}
.control-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Color input field styling */
.color-field-container {
  display: flex;
  align-items: center;
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 4px 8px;
  width: 140px;
}
.color-hex-input {
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  color: var(--text-primary) !important;
  font-family: var(--font-mono) !important;
  font-size: 12px !important;
  padding: 2px !important;
  width: 90px !important;
}
.color-preview-box {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  flex-shrink: 0;
}

/* Custom Select Dropdown */
.custom-select {
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 12px;
  padding: 6px 12px;
  outline: none;
  min-width: 120px;
  text-align: right;
  cursor: pointer;
}

/* Toggle Switch Switch */
.switch {
  position: relative;
  display: inline-block;
  width: 44px;
  height: 22px;
}
.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}
.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(255,255,255,0.1);
  transition: .3s;
  border-radius: 34px;
}
.slider:before {
  position: absolute;
  content: "";
  height: 16px;
  width: 16px;
  left: 3px;
  bottom: 3px;
  background-color: var(--text-primary);
  transition: .3s;
  border-radius: 50%;
}
input:checked + .slider {
  background-color: var(--accent);
}
input:checked + .slider:before {
  transform: translateX(22px);
  background-color: #000;
}

/* Tab row corresponding to Details Styles Content Settings */
.lovart-tabs {
  display: flex;
  gap: 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
  padding-bottom: 8px;
}
.lovart-tab {
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  padding: 4px 8px;
  position: relative;
  text-decoration: none;
  transition: color 0.2s;
}
.lovart-tab:hover {
  color: var(--text-primary);
}
.lovart-tab.active {
  color: var(--accent);
}
.lovart-tab.active::after {
  content: '';
  position: absolute;
  bottom: -9px;
  left: 0;
  width: 100%;
  height: 2px;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent-glow);
}

/* Save changes button */
.btn-outline-gold {
  width: 100%;
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 10px;
  border-radius: var(--radius-sm);
  font-family: var(--font-sans);
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(212, 175, 55, 0.1);
  transition: all 0.2s;
}
.btn-outline-gold:hover {
  background: var(--accent-subtle);
  box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25);
  transform: translateY(-1px);
}

.preview-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  height: 48px;
  flex-shrink: 0;
}
.preview-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--accent);
}
.preview-controls {
  display: flex;
  gap: 8px;
}
.device-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
}
.device-btn:hover {
  border-color: var(--border-glow);
  color: var(--text-primary);
}
.device-btn.active {
  background: var(--accent-subtle);
  color: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
}
.iframe-container {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: #09090c;
  overflow: auto;
}
.preview-iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: #ffffff;
  border-radius: var(--radius-sm);
  box-shadow: 0 10px 45px rgba(0,0,0,0.8);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
/* Device layouts */
.preview-iframe.tablet {
  width: 768px;
  height: 100%;
  max-height: 1024px;
}
.preview-iframe.mobile {
  width: 375px;
  height: 100%;
  max-height: 812px;
}

@media (max-width: 992px) {
  .app-container {
    flex-direction: column;
    height: auto;
    overflow: visible;
  }
  .left-pane {
    width: 100%;
    border-right: none;
    border-bottom: 1px solid var(--border);
    height: auto;
    overflow: visible;
  }
  .right-pane {
    width: 100%;
    height: 600px;
  }
}

/* Workflow Content Container (Backward compatibility style class) */
.workflow-content {
  width: 100%;
  height: 100%;
}
.flow-steps {
  display: flex;
  flex-direction: column;
  gap: 20px;
  width: 100%;
}
.flow-step-card {
  background: var(--bg-card);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  position: relative;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}
.flow-step-card:hover {
  border-color: var(--border-glow);
  box-shadow: 0 12px 40px rgba(212, 175, 55, 0.1);
}
.step-badge {
  position: absolute;
  top: -12px;
  left: 20px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-hover));
  color: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  box-shadow: 0 0 15px var(--accent-glow);
}
.flow-step-card h3 {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Form Controls */
.flow-step-card textarea, .flow-step-card select, .flow-step-card input {
  width: 100%;
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 13.5px;
  padding: 10px 14px;
  outline: none;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
}
.flow-step-card textarea:focus, .flow-step-card select:focus, .flow-step-card input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.25), inset 0 2px 4px rgba(0,0,0,0.5);
}
.flow-step-card select {
  appearance: none;
  cursor: pointer;

function setLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('via54_lang', lang);
  
  // Highlight switcher buttons
  document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById('btn-' + lang).classList.add('active');
  
  translatePage();
}

function translatePage() {
  const dict = i18n[currentLang];
  if (!dict) return;

  // 1. Translate elements with explicit data-i18n-key
  document.querySelectorAll('[data-i18n-key]').forEach(el => {
    const key = el.getAttribute('data-i18n-key');
    if (dict[key]) {
      if (key === 'Design') {
        el.innerHTML = dict[key];
      } else {
        el.textContent = dict[key];
      }
    }
  });

  // 2. Traversal of all text nodes (supports dynamic elements swapped in by HTMX)
  const walker = document.createTreeWalker(
    document.body,
    NodeFilter.SHOW_TEXT,
    {
      acceptNode: function(node) {
        const parent = node.parentElement;
        if (!parent) return NodeFilter.FILTER_REJECT;
        const tag = parent.tagName.toLowerCase();
        if (tag === 'script' || tag === 'style' || parent.closest('.lang-switcher') || parent.closest('.preview-controls')) {
          return NodeFilter.FILTER_REJECT;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    },
    false
  );

  let node;
  const nodesToTranslate = [];
  while (node = walker.nextNode()) {
    nodesToTranslate.push(node);
  }

  nodesToTranslate.forEach(n => {
    const origText = n.nodeValue.trim();
    if (origText && dict[origText]) {
      n.nodeValue = n.nodeValue.replace(origText, dict[origText]);
    }
  });

  // 3. Form input placeholders & option labels
  document.querySelectorAll('input[placeholder], textarea[placeholder]').forEach(el => {
    const ph = el.getAttribute('placeholder');
    if (ph && dict[ph]) {
      el.setAttribute('placeholder', dict[ph]);
    }
  });
  
  document.querySelectorAll('option').forEach(el => {
    const text = el.textContent.trim();
    if (text && dict[text]) {
      el.textContent = dict[text];
    }
  });
}

// ── Preview Sandbox Controls ──
const themes = {
  gold: {
    '--bg': '#1A1A1A',
    '--text-primary': '#F5F0E0',
    '--text-secondary': '#B8A88A',
    '--accent': '#C89B3C',
    '--accent-alt': '#2E5CB8',
    '--border': '#3A3528'
  },
  blue: {
    '--bg': '#08090A',
    '--text-primary': '#E8E8ED',
    '--text-secondary': '#8B8B9E',
    '--accent': '#5E6AD2',
    '--accent-alt': '#4EA7FC',
    '--border': '#1C1C23'
  },
  ink: {
    '--bg': '#F5F0E6',
    '--text-primary': '#1A1A1A',
    '--text-secondary': '#6B6B6B',
    '--accent': '#C43C3A',
    '--accent-alt': '#2A2A2A',
    '--border': '#D9D4CA'
  }
};

function applyLiveTheme(themeKey) {
  const iframe = document.getElementById('preview-frame');
  if (!iframe) return;
  const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
  const variables = themes[themeKey];
  if (!variables || !iframeDoc) return;
  
  const root = iframeDoc.documentElement;
  for (const [key, val] of Object.entries(variables)) {
    root.style.setProperty(key, val);
  }
  
  if (iframeDoc.body) {
    iframeDoc.body.style.backgroundColor = variables['--bg'];
    iframeDoc.body.style.color = variables['--text-primary'];
  }
}

let designModeActive = false;

function toggleDesignMode() {
  const iframe = document.getElementById('preview-frame');
  if (!iframe) return;
  const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
  if (!iframeDoc) return;
  
  designModeActive = !designModeActive;
  const btn = document.getElementById('btn-edit');
  const labelEl = btn ? btn.querySelector('span') : null;
  const dict = i18n[currentLang] || {};
  
  if (designModeActive) {
    if (btn) btn.classList.add('active');
    if (labelEl) labelEl.textContent = (dict["edit-text"] || "编辑文本") + " (ON)";
    
    iframeDoc.querySelectorAll('h1, h2, h3, h4, h5, h6, p, span, li, a, td, th').forEach(el => {
      if (el.children.length === 0 || (el.children.length > 0 && Array.from(el.childNodes).some(n => n.nodeType === Node.TEXT_NODE && n.nodeValue.trim().length > 0))) {
        el.setAttribute('contenteditable', 'true');
        el.style.outline = '1px dashed rgba(212, 175, 55, 0.5)';
        el.style.outlineOffset = '2px';
        el.style.cursor = 'text';
      }
    });
  } else {
    if (btn) btn.classList.remove('active');
    if (labelEl) labelEl.textContent = dict["edit-text"] || "编辑文本";
    
    iframeDoc.querySelectorAll('[contenteditable]').forEach(el => {
      el.removeAttribute('contenteditable');
      el.style.outline = '';
      el.style.outlineOffset = '';
      el.style.cursor = '';
    });
  }
}

function downloadSandboxHTML() {
  const iframe = document.getElementById('preview-frame');
  if (!iframe) return;
  const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
  if (!iframeDoc) return;
  
  // Clone element to prevent visual disruption during export
  const exportDoc = iframeDoc.documentElement.cloneNode(true);
  exportDoc.querySelectorAll('[contenteditable]').forEach(el => {
    el.removeAttribute('contenteditable');
    el.style.outline = '';
    el.style.outlineOffset = '';
    el.style.cursor = '';
  });
  
  const htmlString = '<!DOCTYPE html>\n' + exportDoc.outerHTML;
  const blob = new Blob([htmlString], { type: 'text/html; charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'via54_custom_design.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function setDevice(device) {
  const iframe = document.getElementById('preview-frame');
  if (!iframe) return;
  
  document.querySelectorAll('.device-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById('dev-' + device).classList.add('active');
  
  iframe.className = 'preview-iframe';
  if (device !== 'desktop') {
    iframe.classList.add(device);
  }
}

// Listen to swaps by HTMX and automatically translate the loaded HTML fragments
document.addEventListener('htmx:afterSwap', function(evt) {
  translatePage();
  
  // Check if a path hidden input was rendered (file upload completed or compilation succeeded)
  const hiddenPath = evt.detail.target.querySelector('input[name="_path"]');
  const iframe = document.getElementById('preview-frame');
  
  if (hiddenPath && iframe) {
    const val = hiddenPath.value;
    const filename = val.split(/\/|\\/).pop();
    
    // Auto-update preview iframe source on design or reimagine output success!
    if (val.includes('reimagined_') || val.includes('shot_')) {
      iframe.src = '/uploads/' + filename;
    } else if (val.includes('s2p_')) {
      // Document uploaded - nothing to display in preview iframe, just keep it
    }
  }
});

// Listen to htmx request completions to refresh the design output preview
document.addEventListener('htmx:afterRequest', function(evt) {
  if (evt.detail.pathInfo.requestPath === '/api/htmx/generate' && evt.detail.successful) {
    const iframe = document.getElementById('preview-frame');
    if (iframe) {
      // Force refresh preview by appending time query parameter
      iframe.src = '/api/htmx/preview?t=' + Date.now();
    }
  }
});

let currentThemeMode = localStorage.getItem('via54_theme_mode') || 'dark';

function setThemeMode(mode) {
  currentThemeMode = mode;
  localStorage.setItem('via54_theme_mode', mode);
  
  const btn = document.getElementById('theme-mode-btn');
  if (!btn) return;
  
  if (mode === 'light') {
    document.body.classList.add('light-mode');
    btn.textContent = '🌙 Dark Mode';
  } else {
    document.body.classList.remove('light-mode');
    btn.textContent = '☀️ Light Mode';
  }
}

function toggleThemeMode() {
  if (currentThemeMode === 'dark') {
    setThemeMode('light');
  } else {
    setThemeMode('dark');
  }
}

// Run translation and theme setup once DOM is fully parsed
document.addEventListener('DOMContentLoaded', () => {
  setLanguage(currentLang);
  setThemeMode(currentThemeMode);
});

// Setup sidebar tab navigation visual state swap and reset sandbox designer mode
document.addEventListener('click', function(e) {
  const btn = e.target.closest('.nav-item');
  if (btn) {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    // Reset design mode
    designModeActive = false;
    const editBtn = document.getElementById('btn-edit');
    if (editBtn) {
      editBtn.classList.remove('active');
      const labelEl = editBtn.querySelector('span');
      const dict = i18n[currentLang] || {};
      if (labelEl) labelEl.textContent = dict["edit-text"] || "编辑文本";
    }
  }
});
