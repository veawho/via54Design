<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>via54Design — 设计引擎 (HTMX)</title>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
@media(prefers-reduced-motion:no-preference){.ph-card,.intent-btn,.status-chip{transition:all 0.25s ease}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
:root{--bg:#0c0c10;--bg-elevated:#14141d;--bg-card:#1a1a26;--bg-inset:#22223a;--border:#2a2a44;--border-subtle:#1e1e32;--text-primary:#e6e6f0;--text-secondary:#9898b4;--text-dim:#60607a;--accent:#6c63ff;--accent-hover:#7f78ff;--accent-subtle:rgba(108,99,255,0.1);--accent2:#ff6b9d;--accent3:#43e4b0;--accent4:#ffb347;--radius:10px;--radius-sm:6px;--font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;--font-mono:'JetBrains Mono','Cascadia Code','Fira Code',monospace;--space-1:4px;--space-2:7px;--space-3:11px;--space-4:18px;--space-5:29px;--space-6:47px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text-primary);line-height:1.7;overflow-x:hidden;display:flex;flex-direction:column;min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-subtle);color:var(--accent)}

/* Hero */
.hero-section{text-align:center;padding:var(--space-6) var(--space-4) var(--space-4);border-bottom:1px solid var(--border-subtle)}
.hero-role{font-size:clamp(22px,4vw,36px);font-weight:500;letter-spacing:-0.5px;margin-bottom:var(--space-2)}
.hero-role em{font-style:normal;background:linear-gradient(135deg,var(--accent),var(--accent3));background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-tagline{font-size:clamp(13px,1.8vw,16px);color:var(--text-secondary);max-width:560px;margin:0 auto var(--space-3)}

/* Status bar */
.principles-bar{background:var(--bg-elevated);border-bottom:1px solid var(--border-subtle);padding:var(--space-2) var(--space-4)}
.status-grid{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.status-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius-sm);font-size:11px;background:var(--bg-card);border:1px solid var(--border)}
.status-chip .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot.ok{background:var(--accent3);box-shadow:0 0 6px rgba(67,228,176,0.3)}
.dot.warn{background:var(--accent4);box-shadow:0 0 6px rgba(255,179,71,0.3)}
.dot.off{background:var(--accent2);box-shadow:0 0 6px rgba(255,107,157,0.3)}
.status-chip .label{color:var(--text-secondary)}.status-chip .val{color:var(--text-primary);font-weight:500}

/* Intent bar */
.intent-bar{display:flex;gap:8px;padding:16px 20px;background:var(--bg-elevated);border-bottom:1px solid var(--border-subtle);overflow-x:auto;flex-shrink:0}
.intent-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 20px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-card);cursor:pointer;min-width:100px;flex-shrink:0;font-family:var(--font-sans);color:var(--text-primary);font-size:13px;text-decoration:none}
.intent-btn:hover{border-color:var(--text-dim);background:var(--bg-elevated)}
.intent-btn.active,.intent-btn:focus{border-color:var(--accent);background:var(--accent-subtle);outline:none}
.intent-btn .intent-icon{font-size:22px}
.intent-btn .intent-label{font-size:13px;font-weight:600}

/* Workflow content */
.workflow-content{flex:1;overflow:auto;padding:20px}
.flow-steps{display:flex;gap:16px;flex-wrap:wrap}
.flow-step-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;flex:1;min-width:260px;position:relative}
.step-badge{position:absolute;top:-8px;left:12px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.flow-step-card h3{font-size:14px;font-weight:600;margin-bottom:10px}
.flow-step-card textarea,.flow-step-card select,.flow-step-card input{width:100%;background:var(--bg-inset);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-family:var(--font-sans);font-size:12.5px;padding:7px 10px;outline:none}
.flow-step-card textarea:focus,.flow-step-card select:focus,.flow-step-card input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-subtle)}
.flow-step-card select{appearance:none;cursor:pointer}
.output-area{background:var(--bg-inset);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;font-family:var(--font-mono);font-size:12px;line-height:1.5;overflow:auto;white-space:pre-wrap;word-break:break-word;color:var(--text-secondary)}
.btn-primary{background:var(--accent);color:#fff;border:none;padding:7px 16px;border-radius:var(--radius-sm);cursor:pointer;font-family:var(--font-sans);font-size:13px;font-weight:500}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}
.upload-mini{font-size:12px;color:var(--text-secondary);transition:border-color 0.2s}
.upload-mini:hover{border-color:var(--accent)!important;color:var(--accent)}

/* HTMX indicator */
.htmx-indicator{display:none}
.htmx-request .htmx-indicator{display:inline}
.htmx-request.htmx-indicator{display:inline}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.intent-pane{animation:fadeIn 0.2s ease}
</style>
</head>
<body>

<!-- Hero -->
<div class="hero-section">
  <div class="hero-role">via54<em>Design</em></div>
  <div class="hero-tagline">把人类的灵感种子，转化为 AI 可执行的叙事脚手架</div>
</div>

<!-- Status Bar (HTMX auto-loader) -->
<div class="principles-bar">
  <div hx-get="/api/htmx/status" hx-trigger="load, every 30s" hx-target="this"></div>
</div>

<!-- Intent Bar (HTMX pane switcher) -->
<div class="intent-bar" role="tablist">
  <a href="#" class="intent-btn active" role="tab"
     hx-get="/api/htmx/pane?intent=design" hx-target="#pane-container" hx-trigger="click" hx-swap="innerHTML">
    <span class="intent-icon">🎨</span>
    <span class="intent-label">做设计</span>
  </a>
  <a href="#" class="intent-btn" role="tab"
     hx-get="/api/htmx/pane?intent=prompt" hx-target="#pane-container" hx-trigger="click" hx-swap="innerHTML">
    <span class="intent-icon">📝</span>
    <span class="intent-label">写提示词</span>
  </a>
  <a href="#" class="intent-btn" role="tab"
     hx-get="/api/htmx/pane?intent=present" hx-target="#pane-container" hx-trigger="click" hx-swap="innerHTML">
    <span class="intent-icon">📊</span>
    <span class="intent-label">做演示</span>
  </a>
  <a href="#" class="intent-btn" role="tab"
     hx-get="/api/htmx/pane?intent=video" hx-target="#pane-container" hx-trigger="click" hx-swap="innerHTML">
    <span class="intent-icon">🎬</span>
    <span class="intent-label">做视频</span>
  </a>
  <a href="#" class="intent-btn" role="tab"
     hx-get="/api/htmx/pane?intent=forge" hx-target="#pane-container" hx-trigger="click" hx-swap="innerHTML">
    <span class="intent-icon">⚡</span>
    <span class="intent-label">提交 Forge</span>
  </a>
  <a href="#" class="intent-btn" role="tab"
     hx-get="/api/htmx/pane?intent=reimagine" hx-target="#pane-container" hx-trigger="click" hx-swap="innerHTML">
    <span class="intent-icon">📸</span>
    <span class="intent-label">截图复刻</span>
  </a>
</div>

<div id="pane-container" class="workflow-content" hx-get="/api/htmx/pane?intent=design" hx-trigger="load" hx-swap="innerHTML">
  <div style="text-align:center;padding:40px;color:var(--text-dim)">⏳ 加载中...</div>
</div>

</body>
</html>
