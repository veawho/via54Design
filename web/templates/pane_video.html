<div class="flow-steps">
  <!-- Sub Tabs Navigation -->
  <div class="lovart-tabs" style="margin-bottom:16px; border-bottom:1px solid var(--border); padding-bottom:8px">
    <span class="lovart-tab active" onclick="switchVideoSubTab('prompt')" id="subtab-video-prompt"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 6px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>一句话生成 (LLM)</span>
    <span class="lovart-tab" onclick="switchVideoSubTab('image')" id="subtab-video-image"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 6px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>一张图生成 (图片分析)</span>
    <span class="lovart-tab" onclick="switchVideoSubTab('doc')" id="subtab-video-doc"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 6px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>一个文档生成 (文件分析)</span>
  </div>

  <!-- Section 1: Prompt Guided Video (一句话生成) -->
  <div id="video-section-prompt" class="subtab-section">
    <div class="flow-step-card">
      <h3>一句话生成 — 故事大纲生成视频分镜</h3>
      <form hx-post="/api/htmx/storyboard" hx-target="#vbOutput" hx-indicator="#vbSpin" style="margin-top:12px">
        <textarea name="seed" rows="3" placeholder="在此输入视频叙事描述、核心概念或创意种子提示词，例如: 未来派赛博朋克风大楼设计产品介绍..." style="width:100%;background:var(--bg-inset);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);padding:10px;font-size:12.5px;margin-bottom:10px" required></textarea>
        
        <div style="display:flex;gap:6px;margin-bottom:12px">
          <select name="model" class="custom-select" style="flex:1">
            <option value="three-act">三幕剧架构</option>
            <option value="heros-journey">英雄之旅架构</option>
            <option value="cognitive-arc">认知弧学习模型</option>
            <option value="problem-solution">问题解决营销模型</option>
          </select>
          <input type="number" name="duration" value="30" min="10" max="300" style="width:90px;background:var(--bg-inset);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);padding:8px;font-size:12.5px" placeholder="秒">
        </div>
        
        <div style="display:flex;gap:6px">
          <button type="submit" class="btn-primary">⚡ 开始分析并生成分镜</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Section 2: Image Guided Video (一张图生成) -->
  <div id="video-section-image" class="subtab-section" style="display:none">
    <div class="flow-step-card">
      <h3>一张图生成 — 故事板配图分析分镜</h3>
      <form hx-post="/api/htmx/storyboard" hx-target="#vbOutput" hx-indicator="#vbSpin" hx-encoding="multipart/form-data" style="margin-top:12px">
        <!-- Image Upload Dropzone -->
        <label for="vbImages" class="upload-mini btn-edit-icon" style="border:1px dashed var(--border);border-radius:var(--radius-sm);padding:24px;text-align:center;margin-bottom:12px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
          <span style="font-weight:600;font-size:12px;color:var(--text-primary)">点击多选上传故事板配图 (PNG/JPG)</span>
        </label>
        <input type="file" id="vbImages" name="images" accept="image/*" multiple style="display:none"
               onchange="document.getElementById('vbImgFilesCount').textContent = this.files.length + ' 个分镜文件已就绪';" required>
        <div id="vbImgFilesCount" style="font-size:11px;color:var(--accent3);margin-bottom:8px;text-align:center;font-weight:600"></div>

        <div style="display:flex;gap:6px;margin-bottom:12px">
          <select name="model" class="custom-select" style="flex:1">
            <option value="three-act">三幕剧架构</option>
            <option value="heros-journey">英雄之旅架构</option>
            <option value="cognitive-arc">认知弧学习模型</option>
            <option value="problem-solution">问题解决营销模型</option>
          </select>
          <input type="number" name="duration" value="30" min="10" max="300" style="width:90px;background:var(--bg-inset);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);padding:8px;font-size:12.5px" placeholder="秒">
        </div>
        
        <div style="display:flex;gap:6px">
          <button type="submit" class="btn-primary">🎬 提取故事板分镜</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Section 3: Document Guided Video (一个文档生成) -->
  <div id="video-section-doc" class="subtab-section" style="display:none">
    <div class="flow-step-card">
      <h3>一个文档生成 — 脚本参考文档转视频分镜</h3>
      <form hx-post="/api/htmx/storyboard" hx-target="#vbOutput" hx-indicator="#vbSpin" hx-encoding="multipart/form-data" style="margin-top:12px">
        <!-- Document Upload Dropzone -->
        <label for="vbDoc" class="upload-mini btn-edit-icon" style="border:1px dashed var(--border);border-radius:var(--radius-sm);padding:24px;text-align:center;margin-bottom:12px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          <span style="font-weight:600;font-size:12px;color:var(--text-primary)">上传分镜参考文档 (.docx, .pdf, .txt, .pptx)</span>
        </label>
        <input type="file" id="vbDoc" name="doc" accept=".docx,.pdf,.txt,.pptx" style="display:none"
               onchange="document.getElementById('vbDocName').textContent = this.files[0] ? this.files[0].name : '';" required>
        <div id="vbDocName" style="font-size:11px;color:var(--accent3);margin-bottom:8px;text-align:center;font-weight:600"></div>

        <input type="text" name="seed" placeholder="补充背景/脚本种子描述引导（可选）" style="width:100%;background:var(--bg-inset);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);padding:8px 12px;font-size:12.5px;margin-bottom:12px">

        <div style="display:flex;gap:6px;margin-bottom:12px">
          <select name="model" class="custom-select" style="flex:1">
            <option value="three-act">三幕剧架构</option>
            <option value="heros-journey">英雄之旅架构</option>
            <option value="cognitive-arc">认知弧学习模型</option>
            <option value="problem-solution">问题解决营销模型</option>
          </select>
          <input type="number" name="duration" value="30" min="10" max="300" style="width:90px;background:var(--bg-inset);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);padding:8px;font-size:12.5px" placeholder="秒">
        </div>
        
        <div style="display:flex;gap:6px">
          <button type="submit" class="btn-primary">📊 解析文档并设计分镜</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Shared indicator and output slots -->
  <div style="display:flex;justify-content:center;margin-bottom:12px">
    <span id="vbSpin" class="htmx-indicator" style="font-size:12px;color:var(--accent)">⏳ 正在解析并生成分镜...</span>
  </div>
  
  <div id="vbOutput" style="margin-top:8px"></div>
</div>

<script>
function switchVideoSubTab(tabName) {
  document.querySelectorAll('.lovart-tabs:first-child .lovart-tab').forEach(t => t.classList.remove('active'));
  const activeTab = document.getElementById('subtab-video-' + tabName);
  if (activeTab) activeTab.classList.add('active');

  document.querySelectorAll('.subtab-section').forEach(s => s.style.display = 'none');
  const targetSection = document.getElementById('video-section-' + tabName);
  if (targetSection) targetSection.style.display = 'block';
}
</script>
