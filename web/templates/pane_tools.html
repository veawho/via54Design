<div class="flow-steps">
  <!-- Card 1: Pattern Generator -->
  <div class="flow-step-card">
    <span class="step-badge">1</span>
    <h3 data-i18n-key="tool-pattern-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px;"><path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 14.7255 3.09032 17.1962 4.85857 19C5.34043 19.4819 6.13627 19.3871 6.50535 18.8252C7.03964 18.0125 7.96208 17.5 9 17.5C10.0379 17.5 10.9604 18.0125 11.4947 18.8252C11.8637 19.3871 12.6596 19.4819 13.1414 19C13.6874 18.454 14.5 18.0934 15.3353 18.0934C16.1706 18.0934 16.9832 18.454 17.5292 19"></path><circle cx="7.5" cy="10.5" r="1" fill="currentColor"></circle><circle cx="11.5" cy="7.5" r="1" fill="currentColor"></circle><circle cx="16.5" cy="9.5" r="1" fill="currentColor"></circle></svg>CSS 样式背景生成器</h3>
    <form hx-post="/api/htmx/pattern" hx-target="#patOutput" hx-indicator="#patSpin" style="margin-top:10px">
      <select name="pattern" class="custom-select" style="margin-bottom:8px;width:100%">
        <option value="gold-grid" data-i18n-key="pat-gold">曜金网格 Grid</option>
        <option value="bauhaus-dot" data-i18n-key="pat-dot">包豪斯圆点 Dot</option>
        <option value="mesh-gradient" data-i18n-key="pat-mesh">流光渐变 Mesh</option>
        <option value="luxury-stripe" data-i18n-key="pat-stripe">奢华金条纹 Stripe</option>
      </select>
      <div style="display:flex;gap:6px">
        <button type="submit" class="btn-primary" data-i18n-key="pat-gen">生成背景</button>
        <span id="patSpin" class="htmx-indicator" style="font-size:12px;color:var(--text-dim)" data-i18n-key="compiling">生成中...</span>
      </div>
    </form>
    <div id="patOutput" style="margin-top:8px"></div>
  </div>

  <!-- Card 2: Quality Auditor -->
  <div class="flow-step-card">
    <span class="step-badge">2</span>
    <h3 data-i18n-key="tool-quality-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 11 2 2 4-4"></path></svg>网页设计规范审计</h3>
    <form hx-post="/api/htmx/quality" hx-target="#quaOutput" hx-indicator="#quaSpin" style="margin-top:10px">
      <textarea name="html_code" rows="4" placeholder="粘贴 HTML 代码到此处进行规范性审查，留空则默认审计上一阶段生成的 output.html..." style="margin-bottom:8px" data-i18n-key="tool-quality-ph"></textarea>
      <div style="display:flex;gap:6px">
        <button type="submit" class="btn-primary" data-i18n-key="tool-quality-btn">开始审计</button>
        <span id="quaSpin" class="htmx-indicator" style="font-size:12px;color:var(--text-dim)" data-i18n-key="analyzing">审计中...</span>
      </div>
    </form>
    <div id="quaOutput" style="margin-top:8px"></div>
  </div>

  <!-- Card 3: Preset Registry Browser -->
  <div class="flow-step-card">
    <span class="step-badge">3</span>
    <h3 data-i18n-key="tool-list-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>系统内置预置名录</h3>
    <div style="margin-top:10px">
      <button hx-post="/api/htmx/list" hx-target="#listOutput" hx-indicator="#listSpin" class="btn-primary" data-i18n-key="tool-list-btn">
        查看全部预置名录 (Layout/Color/Font)
      </button>
      <span id="listSpin" class="htmx-indicator" style="font-size:12px;color:var(--text-dim);margin-left:8px" data-i18n-key="loading">读取中...</span>
    </div>
    <div id="listOutput" style="margin-top:8px;max-height:300px;overflow-y:auto"></div>
  </div>

  <!-- Card 4: AI Wenda Assistant -->
  <div class="flow-step-card">
    <span class="step-badge">4</span>
    <h3 data-i18n-key="tool-ai-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>AI 智能设计问答</h3>
    <form hx-post="/api/htmx/ai" hx-target="#aiOutput" hx-indicator="#aiSpin" style="margin-top:10px">
      <textarea name="prompt" rows="3" placeholder="例如: 帮我设计一个包豪斯风格的色彩搭配..." style="margin-bottom:8px" data-i18n-key="tool-ai-ph"></textarea>
      <div style="display:flex;gap:6px">
        <button type="submit" class="btn-primary" data-i18n-key="tool-ai-btn">发送提问</button>
        <span id="aiSpin" class="htmx-indicator" style="font-size:12px;color:var(--text-dim)" data-i18n-key="thinking">思考中...</span>
      </div>
    </form>
    <div id="aiOutput" style="margin-top:8px"></div>
  </div>


  <!-- Card 5: Handwriting/Logo to SVG Vectorizer -->
  <div class="flow-step-card">
    <span class="step-badge">5</span>
    <h3 data-i18n-key="tool-trace-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px;"><path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z"></path><path d="M12 8V16"></path><path d="M8 12H16"></path></svg>手写文字/Logo 矢量化 (Image to SVG)</h3>
    <form hx-post="/api/htmx/trace" hx-target="#traOutput" hx-indicator="#traSpin" hx-encoding="multipart/form-data" style="margin-top:10px">
      <label for="traFile" class="upload-mini btn-edit-icon" style="border:1px dashed var(--border);border-radius:var(--radius-sm);padding:16px;text-align:center;margin-bottom:12px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
        <span data-i18n-key="tool-trace-btn-label">点击上传手写文字或 Logo 图片</span>
      </label>
      <input type="file" id="traFile" name="image" accept=".png,.jpg,.jpeg" style="display:none"
             onchange="document.getElementById('traFileName').textContent = this.files[0] ? this.files[0].name : '';">
      <div id="traFileName" style="font-size:11px;color:var(--accent3);margin-bottom:8px;text-align:center"></div>

      <div style="display:flex;gap:6px">
        <button type="submit" class="btn-primary" data-i18n-key="tool-trace-btn">矢量化为 SVG</button>
        <span id="traSpin" class="htmx-indicator" style="font-size:12px;color:var(--text-dim)" data-i18n-key="analyzing">矢量化转换中...</span>
      </div>
    </form>
    <div id="traOutput" style="margin-top:8px"></div>
  </div>
</div>
