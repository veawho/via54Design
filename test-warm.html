<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>羽图鉴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
--bg: #F5F0E8;
--text-primary: #191919;
--text-secondary: #6B6258;
--accent: #CC785C;
--accent-hover: #B8654A;
--border: #E8DFD4;
  --size-display: clamp(42px, 6vw, 96px);
  --size-h2: clamp(28px, 3vw, 48px);
  --size-h3: clamp(20px, 1.5vw, 28px);
  --size-body: clamp(16px, 1.2vw, 21px);
  --size-small: 14px;
  --size-caption: 12px;
}
* { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
  font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif; line-height:1.7;
  color: var(--text-primary, #1A1A1A);
  background: var(--background, #FFFFFF);
}
h1,h2,h3,h4 { font-family: 'Fraunces', 'Newsreader', 'Georgia', serif; line-height:1.1; }
code,pre { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
a { color: var(--accent, inherit); text-decoration:none; }
img { max-width: 100%%; height:auto; display:block; }
.container { max-width:1200px; margin:0 auto; padding:0 40px; }
@media (max-width:768px) { .container { padding:0 24px; } }
.hero-split {
  display: grid;
  grid-template-columns: 5fr 7fr;
  min-height: 100vh;
}
.hero-split__image {
  position: relative;
  overflow: hidden;
}
.hero-split__image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.hero-split__image::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(0,0,0,0.12) 0%, transparent 50%);
}
.hero-split__text {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 120px 80px;
  max-width: 520px;
}
.hero-split__eyebrow {
  font-size: clamp(11px, 0.75vw, 14px);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 24px;
}
.hero-split__headline {
  font-size: clamp(42px, 6vw, 96px);
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin-bottom: 32px;
}
.hero-split__body {
  font-size: clamp(16px, 1.2vw, 21px);
  line-height: 1.7;
  max-width: 50ch;
  margin-bottom: 40px;
}
.hero-split__cta {
  display: inline-flex;
  padding: 16px 32px;
  border: 2px solid currentColor;
  font-weight: 500;
  text-decoration: none;
  transition: all 0.2s;
}
.hero-split__cta:hover {
  background: currentColor;
  color: var(--bg, #fff);
}
@media (max-width: 768px) {
  .hero-split {
    grid-template-columns: 1fr;
  }
  .hero-split__image { min-height: 40vh; }
  .hero-split__text { padding: 60px 32px; }
}

</style>
</head>
<body>
<main>
<section class="hero-split">
  <div class="hero-split__image"><!-- img --></div>
  <div class="hero-split__text">
    <p class="hero-split__eyebrow">EYEBROW</p>
    <h1 class="hero-split__headline">标题</h1>
    <p class="hero-split__body">副标题</p>
    <a class="hero-split__cta" href="#">CTA</a>
  </div>
</section>
</main>
</body>
</html>
