# via54Design 经典配色
# Candy Duolingo — 绿+黄+天蓝，游戏化教育
id: candy-duolingo
name:
  zh: "糖果色"
  en: "Candy Duolingo"
  ja: "キャンディ"
metadata:
  designer: via54 / Duolingo (Johnson Banks)
  cultural_context: "Duolingo通过糖果般的色彩组合打破了教育软件'严肃'的刻板印象。其标志性的Duo绿+鸭子黄已经成为游戏化学习的视觉代名词。"
  philosophy: "学习应该像糖果一样让人愉悦"
mood: [playful, friendly, energetic, warm, educational]
season: spring
palette:
  - role: background
    hex: "#FFFFFF"
    name_zh: "白"
    cultural_note: "干净画布"
  - role: text_primary
    hex: "#1A1A2E"
    name_zh: "深蓝黑"
    cultural_note: "舒适阅读深色"
  - role: text_secondary
    hex: "#6B6B80"
    name_zh: "灰紫"
    cultural_note: "柔和辅助色"
  - role: accent
    hex: "#58CC02"
    name_zh: "Duo绿"
    cultural_note: "Duolingo标志性绿色"
  - role: accent_alt
    hex: "#FFC800"
    name_zh: "鸭子黄"
    cultural_note: "Duolingo吉祥物颜色"
  - role: border
    hex: "#E0E0E8"
    name_zh: "淡灰"
    cultural_note: "柔和边界"


css_variables: |
  --bg: #FFFFFF;
  --text-primary: #1A1A2E;
  --text-secondary: #6B6B80;
  --accent: #58CC02;
  --accent-alt: #FFC800;
  --border: #E0E0E8;

compatibility:
  layouts: [bento-grid-2x2, hero-split-left-image]
  fonts: [playful-rounded, sans-geometric-tech]
