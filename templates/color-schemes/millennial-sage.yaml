    hex: "#FAF5F0"
    name_zh: "暖白"
    cultural_note: "Glossier式的极简暖白"
  - role: text_primary
    hex: "#2D3436"
    name_zh: "深灰"
    cultural_note: "柔和的黑，不刺眼"
  - role: text_secondary
    hex: "#8B8B8B"
