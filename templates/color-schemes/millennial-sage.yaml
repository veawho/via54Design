# via54Design Adobe/Behance配色
# Millennial Sage — Behance上最出圈的粉绿搭配
id: millennial-sage
name:
  zh: "千禧鼠尾草"
  en: "Millennial Sage"
  ja: "ミレニアルセージ"
metadata:
  designer: via54 / Behance 全球趋势
  platform: Behance / Instagram / Pinterest 最热门配色
  cultural_context: "千禧粉(Millennial Pink) + 鼠尾草绿(Sage Green)的组合是2018-2023年Behance上被复制最多的配色之一。从Glossier的品牌视觉到Airbnb的营销素材，这套配色定义了'Instagram美学'的时代。它的流行不是偶然——粉绿在色相环上相距120度，属于对比色搭配，既和谐又有张力。"
  philosophy: "温柔而有力量。不喧哗，自有声。"
mood: [gentle, trendy, warm, femine, sophisticated]
season: spring
