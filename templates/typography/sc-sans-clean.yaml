# via54Design 字体模板
# 中文无衬线 — 干净利落，中英同款
id: sc-sans-clean
name:
  zh: "中文无衬线"
  en: "SC Sans"
  ja: "中国語サンズ"
metadata:
  designer: via54 / Google Noto Project
  classification: "无衬线(Sans Serif)，中日英统一"
  inspiration: "Google Noto(No Tofu)项目的使命：消灭豆腐块(□)。Noto Sans SC + Noto Serif SC覆盖了CJK统一汉字区域。与Geist/Vercel的跨界搭配，让中文界面也能有国际级的设计感。"
  principle: "无豆腐块。每一个字都应该被优雅地呈现。"
mood: [clean, modern, professional, accessible, minimal]
chinese:
  display_body: true
  note: "最安全的中文字体选择，零兼容问题"

fonts:
  display: "'Noto Sans SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Geist', sans-serif"
  body: "'Noto Sans SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Inter', sans-serif"
  mono: "'JetBrains Mono', monospace"

weights:
  display: "700;900"
  body: "300;400;500"

google_fonts:
  - "Noto+Sans+SC:wght@300;400;500;700;900"

sizes:
  display: "clamp(34px, 5vw, 64px)"
  h2: "clamp(22px, 2.5vw, 38px)"
  h3: "clamp(18px, 1.5vw, 24px)"
  body: "clamp(15px, 1.1vw, 18px)"
  small: "13px"
  caption: "12px"

compatibility:
  moods: [clean, modern, professional, accessible, minimal, tech]
  layouts: [bento-grid-2x2, hero-split-left-image, gallery-waterfall]
