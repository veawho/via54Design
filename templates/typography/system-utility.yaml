# ─── 元数据 ───
id: system-utility
name: 系统字栈（社区/文档/功能性配）
version: "1.0.0"
category: typography/pair
tags: [system, utility, functional, clean, fast, accessible]

fonts:
  display: "system-ui, -apple-system, 'Segoe UI', sans-serif"
  display_weight: 700
  body: "system-ui, -apple-system, 'Segoe UI', sans-serif"
  body_weight: 400
  mono: "'JetBrains Mono', 'Consolas', 'Courier New', monospace"

sizes:
  display: "clamp(32px, 4vw, 56px)"
  h2: "clamp(20px, 2vw, 32px)"
  h3: "clamp(16px, 1.3vw, 22px)"
  body: "clamp(14px, 1vw, 16px)"
  small: "12px"
  caption: "11px"

when:
  brand_tone: [clean, functional, minimal, accessible, fast]
  suitable_for: [community, docs, data_dense, utility_app, ugc_platform]
