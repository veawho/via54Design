# ─── 元数据 ───
id: mono-terminal
name: 等宽字主角+无衬线辅助（终端/CLI产品配）
version: "1.0.0"
category: typography/pair
tags: [mono, terminal, cli, developer, tech, futuristic]

fonts:
  display: "'Geist Mono', 'JetBrains Mono', 'IBM Plex Mono', monospace"
  display_weight: 700
  body: "'Geist Mono', 'JetBrains Mono', monospace"
  body_weight: 400
  accent_sans: "'Inter', -apple-system, sans-serif"

sizes:
  display: "clamp(32px, 4vw, 64px)"
  h2: "clamp(20px, 2vw, 32px)"
  body: "clamp(14px, 1vw, 16px)"
  code: "clamp(13px, 0.9vw, 15px)"
  small: "12px"

when:
  brand_tone: [tech, developer, futuristic, terminal, precise]
  suitable_for: [cli_product, devtool, terminal_app, code_showcase]
