# ─── 元数据 ───
id: serif-longform
name: 阅读级衬线正文+无衬线辅助（年报/长文配）
version: "1.0.0"
category: typography/pair
tags: [serif, longform, reading, editorial, annual-report]

fonts:
  display: "'Playfair Display', 'Fraunces', 'Georgia', serif"
  display_weight: 700
  body: "'Newsreader', 'Source Serif 4', 'Lora', 'Georgia', serif"
  body_weight: 400
  body_line_height: 1.8
  body_max_width: "65ch"
  accent: "'Inter', -apple-system, sans-serif"
  mono: "'JetBrains Mono', 'IBM Plex Mono', monospace"

sizes:
  display: "clamp(36px, 4vw, 64px)"
  h2: "clamp(22px, 2vw, 32px)"
  body: "clamp(16px, 1.1vw, 19px)"
  small: "14px"
  caption: "12px"

when:
  brand_tone: [editorial, premium, authoritative, literary]
  suitable_for: [annual_letter, research_report, manifesto, long_read]
