# ─── 元数据 ───
id: bento-grid-2x2
name: Bento便当格2×2不等高卡片
version: "1.0.0"
created: 2026-06-07
author: huashu-design
category: layout/bento
tags: [bento, grid, cards, metrics, features, data]

when:
  content_has: [multiple_cards, metrics, data_points]
  suitable_for: [dashboard, feature_showcase, qbr, metrics_page]
  min_cards: 3
  max_cards: 8

structure:
  type: css-grid
  template: |
    grid-template-areas:
      "card-a card-a card-b"
      "card-c card-d card-b"
  gap: 1px
  min_height: auto
  max_width: 1200px
  margin: "0 auto"

elements:
  - role: card
    behavior: repeat
    min_count: 3
    max_count: 8
    style: bordered-card
    padding: [48, 40]
    border_radius: 0
    border_width: 1
    hover: lift-shadow

    children:
      - role: metric-number
        tag: span
        font_size: "clamp(40px, 5vw, 80px)"
        font_weight: 700
        font_variant: tabular-nums
        line_height: 1
        margin_bottom: 8

      - role: metric-label
        tag: p
        font_size: 14px
        letter_spacing: "0.05em"
        text_transform: uppercase
        margin_bottom: 16

      - role: metric-description
        tag: p
        font_size: 15px
        line_height: 1.6
        max_width: 35ch

    # 大卡片（跨2列）的覆盖
    variants:
      - role: hero-card
        spans: [2, 1]  # columns, rows
        children:
          - role: metric-number
            font_size: "clamp(60px, 8vw, 120px)"
          - role: sparkline
            type: svg-inline
            height: 40

css: |
  .bento-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-auto-rows: minmax(200px, auto);
    gap: 1px;
    max-width: 1200px;
    margin: 0 auto;
    background: var(--border, #E8DFD4);
  }
  .bento-grid > * {
    background: var(--bg, #fff);
    padding: 48px 40px;
  }
  .bento-card__number {
    font-size: clamp(40px, 5vw, 80px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    margin-bottom: 8px;
  }
  .bento-card__label {
    font-size: 14px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .bento-card__desc {
    font-size: 15px;
    line-height: 1.6;
    max-width: 35ch;
  }
  .bento-card--hero {
    grid-column: span 2;
  }
  .bento-card--hero .bento-card__number {
    font-size: clamp(60px, 8vw, 120px);
  }
  .bento-card:hover {
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    transition: box-shadow 0.3s;
  }
  @media (max-width: 768px) {
    .bento-grid {
      grid-template-columns: 1fr;
    }
    .bento-card--hero { grid-column: span 1; }
  }

quality:
  min_font_size: 14px
  max_cards_per_row: 5
  min_contrast_ratio: 4.5:1
  max_info_density: "3个数据/卡片"

examples:
  - brand: Apple Keynote
    notes: "Bento Grid时代，不等高卡片+metric spotlight"
  - brand: Stripe Annual Letter
    notes: "指标卡矩阵，数据锚点+sparkline"

changelog:
  "1.0.0": "从Apple Bento Grid + Stripe 年报指标卡迁移"
