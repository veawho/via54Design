# via54Design 布局模板 v2
# 左右分割式 Hero — 16:9 视频基准 · 四端适配
# 参考: Extra-Strength Responsive Grids (⭐254) + CSS Container Queries
id: hero-split-16-9
name:
  zh: "左右分割式 Hero (16:9)"
  en: "Split Hero (16:9)"
version: "2.0.0"
category: layout/hero
tags: [hero, split, editorial, image-left, full-bleed, 16-9, video-ready]

when:
  content_has: [hero_image, headline, subtitle]
  suitable_for: [landing, product_page, brand_story, video_opening, ad]

# ─── 视口基准 ───
viewport:
  baseline: "16:9"
  min_height: 100dvh
  max_width: 1920px

# ─── 结构 ───
structure:
  type: grid-2col
  ratio: "5fr 7fr"
  gap: "0"

# ─── 黄金比例间距 (base=4, ratio=φ=1.618) ───
spacing:
  base: 4
  ratio: 1.618
  semantic:
    section: "step-8"   # 84px
    card: "step-5"      # 32px
    inline: "step-3"    # 12px

# ─── 4 端响应式 ───
responsive:
  - name: tv
    min_width: 1920
    columns: "5fr 7fr"
    font_scale: 1.3
    safe_area: [80, 120, 80, 120]   # TV overscan 安全区
    spacing_scale: 1.2
    ratio_lock: "16:9"

  - name: desktop
    min_width: 1280
    max_width: 1919
    columns: "5fr 7fr"
    font_scale: 1.0
    safe_area: [0, 0, 0, 0]
    spacing_scale: 1.0
    ratio_lock: "16:9"

  - name: tablet
    min_width: 768
    max_width: 1279
    columns: "1fr"
    font_scale: 0.9
    stack: true
    stack_order: [text, image]
    safe_area: [0, 32, 0, 32]
    spacing_scale: 0.8
    full_bleed: false

  - name: phone
    min_width: 0
    max_width: 767
    columns: "1fr"
    font_scale: 0.72
    stack: true
    stack_order: [text, image]
    safe_area: [0, 20, 0, 20]
    spacing_scale: 0.6
    full_bleed: false
    hide_roles: [eyebrow]

# ─── 元素树 ───
elements:
  - role: image-container
    position: left
    behavior: full-bleed
    z_index: 1
    padding: [0]
    children:
      - role: image
        tag: div
        behavior: cover
        style: aspect-ratio-16-9

  - role: text-container
    position: right
    align: center-left
    padding: [120, 80, 120, 80]
    max_width: 560px
    children:
      - role: eyebrow
        tag: p
        font_size: "clamp(11px, 0.7vw, 14px)"
        letter_spacing: "0.15em"
        text_transform: uppercase
        style: eyebrow
      - role: headline
        tag: h1
        font_size: "clamp(36px, 5vw, 88px)"
        font_weight: 700
        line_height: 1.05
        letter_spacing: "-0.02em"
        style: headline
      - role: body
        tag: p
        font_size: "clamp(15px, 1.1vw, 20px)"
        line_height: 1.7
        max_width: 50ch
        style: body
      - role: cta
        tag: a
        padding: [16, 32]
        style: button-outline

# ─── CSS ───
css: |
  /* ── 容器基准 (16:9) ── */
  .layout-hero-split {
    container-type: inline-size;
    container-name: hero;
    aspect-ratio: 16 / 9;
    width: 100%;
    max-width: var(--layout-max-width, 1920px);
    margin: 0 auto;
    display: grid;
    grid-template-columns: 5fr 7fr;
    min-height: 100dvh;
    overflow: hidden;
    position: relative;
  }

  /* ── TV 端 (≥1920px) ── */
  @media (min-width: 1920px) {
    .layout-hero-split {
      max-width: 100%;
      aspect-ratio: 16 / 9;
    }
    .layout-hero-split__text {
      padding: 80px 120px;
    }
  }

  /* ── Desktop (1280-1919px) ── */
  @media (min-width: 1280px) and (max-width: 1919px) {
    .layout-hero-split {
      aspect-ratio: 16 / 9;
    }
  }

  /* ── Tablet (768-1279px) — 堆叠 ── */
  @media (min-width: 768px) and (max-width: 1279px) {
    .layout-hero-split {
      grid-template-columns: 1fr;
      aspect-ratio: auto;
      min-height: 100dvh;
    }
    .layout-hero-split__image {
      min-height: 40vh;
      order: 2;
    }
    .layout-hero-split__text {
      padding: 60px 32px;
      order: 1;
      max-width: 100%;
    }
  }

  /* ── Phone (<768px) ── */
  @media (max-width: 767px) {
    .layout-hero-split {
      grid-template-columns: 1fr;
      aspect-ratio: auto;
      min-height: 100svh;
    }
    .layout-hero-split__image {
      min-height: 30vh;
      order: 2;
    }
    .layout-hero-split__text {
      padding: 40px 20px;
      order: 1;
      max-width: 100%;
    }
    .layout-hero-split__eyebrow {
      display: none;
    }
    .layout-hero-split__headline {
      font-size: clamp(28px, 8vw, 42px);
    }
  }

  /* ── Container Query: 宽度 <600px 时适配小屏容器 ── */
  @container hero (max-width: 600px) {
    .layout-hero-split {
      grid-template-columns: 1fr;
    }
    .layout-hero-split__image {
      min-height: 30vh;
      order: 2;
    }
    .layout-hero-split__text {
      padding: 32px 16px;
      order: 1;
    }
  }

  /* ── 安全区域 (TV overscan) ── */
  @media (min-width: 1920px) {
    .layout-hero-split__text {
      padding-left: 120px;
      padding-right: 120px;
    }
  }

  /* ── 图片容器 ── */
  .layout-hero-split__image {
    position: relative;
    overflow: hidden;
    background: var(--accent, #eee);
  }
  .layout-hero-split__image::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(0,0,0,0.12) 0%, transparent 50%);
    pointer-events: none;
  }
  .layout-hero-split__image img,
  .layout-hero-split__image video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* ── 文字容器 ── */
  .layout-hero-split__text {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 120px 80px;
    max-width: 520px;
  }

  /* ── 子元素 ── */
  .layout-hero-split__eyebrow {
    font-size: clamp(11px, 0.7vw, 14px);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: clamp(16px, 2vw, 24px);
    opacity: 0.6;
  }
  .layout-hero-split__headline {
    font-size: clamp(36px, 5vw, 88px);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: clamp(20px, 3vw, 32px);
  }
  .layout-hero-split__body {
    font-size: clamp(15px, 1.1vw, 20px);
    line-height: 1.7;
    max-width: 50ch;
    margin-bottom: clamp(24px, 3.5vw, 40px);
  }
  .layout-hero-split__cta {
    display: inline-flex;
    align-items: center;
    padding: 16px 32px;
    border: 2px solid currentColor;
    font-weight: 500;
    text-decoration: none;
    transition: all 0.2s;
    width: fit-content;
  }
  .layout-hero-split__cta:hover {
    background: currentColor;
    color: var(--bg, #fff);
  }

  /* ── 质量约束 ── */
  .layout-hero-split__body {
    max-width: 50ch;
  }

# ── 质量 ──
quality:
  min_font_size: 15px
  max_line_length: 50ch
  min_contrast_ratio: 4.5:1
  viewport_lock: "16:9"

# ── 案例 ──
examples:
  - brand: Anthropic
    url: https://anthropic.com
    notes: "奶油纸底+赤陶橙，启发 hero-split 布局"
  - brand: Stripe
    url: https://stripe.com
    notes: "斜切渐变 hero，栅格比例参考"

changelog:
  "2.0.0": "16:9 基准 + TV/Desktop/Tablet/Phone 四端适配 + CSS Container Queries + 黄金比例间距"
  "1.0.0": "初始版，仅 mobile 单断点响应"
