[package]
name = "via54-engine"
version = "0.1.0"
edition = "2021"
description = "via54Design Rust core — template parsing, CSS generation, WASM target"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
