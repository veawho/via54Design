## 组合规则

# 布局 × 配色 × 字体 × 动画 = 完整页面
# 示例组合推荐：

combinations:
  - name: 暖色编辑Hero
    layout: hero-split-left-image
    color: warm-editorial-cream
    font: serif-sans-editorial
    animation: hero-reveal-stagger
    suitable: [ai_product, brand_hero, landing_page]

  - name: 暗色数据Bento
    layout: bento-grid-2x2
    color: dark-terminal-blue
    font: sans-geometric-tech
    animation: card-hover-lift
    suitable: [dashboard, qbr, feature_showcase, saas]

  - name: 瑞士极简画廊
    layout: gallery-waterfall
    color: swiss-monochrome
    font: system-utility
    suitable: [portfolio, gallery, moodboard, showcase]

compatibility:
  rules:
    - "layout.full-bleed 与 color-scheme.dark 搭配效果最佳"
    - "layout.editorial 与 color-scheme.warm 天然适配"
    - "animation.interaction 与 layout.bento 搭配（卡片悬停）"
    - "candy-duolingo 搭配 playful-rounded 字体效果最佳"
    - "cosmic-retro 搭配 cormorant-elegant 字体效果最佳"
    - "editorial-brutalist 搭配 display-sans-bold 字体效果最佳"
